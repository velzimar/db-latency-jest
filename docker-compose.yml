services:
  postgres:
    image: postgres:16
    container_name: db-latency-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    # The connection limit is what makes "too many replicas" hurt.
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      - "5433:5432"   # 5433 on the host so it never clashes with a local Postgres
    cpus: 2           # a small DB server: CPU is shared by all running queries
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 20
